name: acme_widget
description: Example plugin for husk_sdk that wraps the fake AcmeWidgetSDK.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.acme_widget
        pluginClass: AcmeWidgetPlugin
      ios:
        pluginClass: AcmeWidgetPlugin
